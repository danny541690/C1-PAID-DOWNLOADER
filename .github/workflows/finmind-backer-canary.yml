name: FinMind Backer - read-only connectivity and schema canary
on:
  workflow_dispatch:
    inputs:
      r12_origin:
        description: Private R12 rollout origin run ID for automatic continuation
        type: string
        default: ''
  push:
    paths:
      - ".github/workflows/finmind-backer-canary.yml"
      - "scripts/finmind_backer_canary.py"
permissions:
  contents: read
concurrency:
  group: ${{ inputs.r12_origin != '' && 'r12-1-bounded-preflight' || format('backer-canary-{0}', github.run_id) }}
  cancel-in-progress: false
jobs:
  finmind-schema-canary:
    if: inputs.r12_origin == '' && !contains(github.event.head_commit.message, '[r12-rollout-gates]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test FinMind Backer token and capture observed schema
        env:
          FINMIND_BACKER_TOKEN: ${{ secrets.FINMIND_BACKER_TOKEN }}
        run: python3 scripts/finmind_backer_canary.py
      - name: Upload factual API results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finmind-backer-observed-schema
          path: finmind_canary_report/
          retention-days: 7
          if-no-files-found: warn
  r12-resume-dispatch:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/r11-1-backer-preflight' && inputs.r12_origin != ''
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reopen the frozen manifest and dispatch the next wave using the same quota ledger
        env:
          R12_ORIGIN: ${{ inputs.r12_origin }}
          FINMIND_BACKER_TOKEN: ${{ secrets.FINMIND_BACKER_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python3 -m scripts.r11_backer.release_rollout dispatch --origin "$R12_ORIGIN"
  r12-resume-accept:
    needs: r12-resume-dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Independently verify both waves and record acceptance and repairs
        env:
          R12_ORIGIN: ${{ inputs.r12_origin }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python3 -m scripts.r11_backer.release_rollout accept --origin "$R12_ORIGIN"
  r12-resume-archive:
    if: always() && github.repository == 'danny541690/C1-PAID-DOWNLOADER' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/r11-1-backer-preflight' && inputs.r12_origin != ''
    needs: [r12-resume-dispatch, r12-resume-accept]
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive the continuation logs and verify private Drive readback
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python3 -m scripts.r11_backer.test_archive --current-only
