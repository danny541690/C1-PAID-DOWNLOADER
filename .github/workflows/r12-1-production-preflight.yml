name: R12.1 consolidated production prerequisites
on:
  push:
    branches: [codex/r11-1-backer-preflight]
    paths:
      - .github/workflows/r12-1-production-preflight.yml
      - scripts/r11_backer/production_preflight.py
      - scripts/r11_backer/release_rehearsal.py
      - scripts/r11_backer/cross_run_ledger.py
      - scripts/r11_backer/live_bronze_admission.py
      - scripts/r11_backer/release_batch.py
      - scripts/r11_backer/finish_preflight.py
      - scripts/r11_backer/release_rollout.py
permissions:
  contents: read
concurrency:
  group: r12-1-bounded-preflight
  cancel-in-progress: false
jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify manifest logic, bounded dispatch and retry handoff
        run: |
          python3 -m unittest discover -s tests
          python3 -m scripts.r11_backer.bounded_schedule
          python3 - <<'PY'
          from scripts.r11_backer.final_preflight import test_capacity_and_split, test_retry
          from scripts.r11_backer.integration_pilot import fixtures, negative_cases
          print(test_retry())
          print(test_capacity_and_split())
          print(f"negative_integrity_cases={negative_cases(fixtures()[0])}")
          PY
      - name: Read current private manifest and capacity prerequisites
        if: ${{ !contains(github.event.head_commit.message, '[r12-rollout-gates]') }}
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python3 -m scripts.r11_backer.production_preflight
  rehearsal-prepare:
    if: >-
      ${{ !contains(github.event.head_commit.message, '[r12-cross-run]') &&
          !contains(github.event.head_commit.message, '[r12-live-bronze]') &&
          !contains(github.event.head_commit.message, '[r12-release-batch]') &&
          !contains(github.event.head_commit.message, '[r12-finish-preflight]') &&
          !contains(github.event.head_commit.message, '[r12-finish-readback]') &&
          !contains(github.event.head_commit.message, '[r12-rollout-gates]') }}
    needs: release-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: B00 freezes manifest and journals before staging archived originals
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python3 -m scripts.r11_backer.release_rehearsal prepare
  rehearsal-recover:
    needs: rehearsal-prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: B09 reopens the journal, rejects stale generation and repairs
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python3 -m scripts.r11_backer.release_rehearsal recover
  rehearsal-accept:
    needs: rehearsal-recover
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: B10 validates original bytes, complete inventory and durable receipts
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python3 -m scripts.r11_backer.release_rehearsal accept
  ledger-origin:
    if: contains(github.event.head_commit.message, '[r12-cross-run]')
    needs: release-check
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Freeze the private batch and race a second workflow for one lease
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python3 -m scripts.r11_backer.cross_run_ledger origin
  ledger-acceptance:
    needs: ledger-origin
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Independently reconcile both runs, the lease and the saved originals
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python3 -m scripts.r11_backer.cross_run_ledger audit
  live-bronze-capture:
    if: contains(github.event.head_commit.message, '[r12-live-bronze]')
    needs: release-check
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reserve at most one account check and one Backer-only partition before requesting
        env:
          FINMIND_BACKER_TOKEN: ${{ secrets.FINMIND_BACKER_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python3 -m scripts.r11_backer.live_bronze_admission capture
  live-bronze-accept:
    needs: live-bronze-capture
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the formal Bronze original and replay using the saved receipt
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          python3 -m scripts.r11_backer.live_bronze_admission accept
          python3 -m scripts.r11_backer.live_bronze_admission capture
  batch-dispatch:
    if: contains(github.event.head_commit.message, '[r12-release-batch]')
    needs: release-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Freeze and dispatch only evidenced windows through the shared quota ledger
        env:
          FINMIND_BACKER_TOKEN: ${{ secrets.FINMIND_BACKER_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python3 -m scripts.r11_backer.release_batch dispatch
  batch-accept:
    needs: batch-dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Independently validate the full batch and publish verified originals to Bronze
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python3 -m scripts.r11_backer.release_batch accept
      - name: Read the final receipts again without a provider credential
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python3 -m scripts.r11_backer.release_batch audit
  finish-source:
    if: contains(github.event.head_commit.message, '[r12-finish-preflight]')
    needs: release-check
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reconcile prior evidence and probe unresolved windows in parallel
        env:
          FINMIND_BACKER_TOKEN: ${{ secrets.FINMIND_BACKER_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python3 -m scripts.r11_backer.finish_preflight dispatch
  finish-existing:
    if: contains(github.event.head_commit.message, '[r12-finish-preflight]')
    needs: release-check
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify accepted Bronze originals from the first batch without re-fetching
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python3 -m scripts.r11_backer.release_batch audit
  finish-accept:
    needs: [finish-source, finish-existing]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reconcile all new source receipts and publish independently proved scopes
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python3 -m scripts.r11_backer.finish_preflight accept
  finish-readback:
    if: contains(github.event.head_commit.message, '[r12-finish-readback]')
    needs: release-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reopen the completed source ledger and verify saved originals without FinMind access
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python3 -m scripts.r11_backer.finish_preflight accept --source-run 45831567041
  rollout-dispatch:
    if: contains(github.event.head_commit.message, '[r12-rollout-gates]')
    needs: release-check
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Freeze the private manifest and dispatch the first bounded wave
        env:
          FINMIND_BACKER_TOKEN: ${{ secrets.FINMIND_BACKER_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python3 -m scripts.r11_backer.release_rollout dispatch
  rollout-accept:
    needs: rollout-dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      resume: ${{ steps.accept.outputs.resume }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Independently accept the first wave and record the checkpoint
        id: accept
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python3 -m scripts.r11_backer.release_rollout accept
  rollout-resume-trigger:
    if: needs.rollout-accept.outputs.resume == 'true'
    needs: rollout-accept
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read
    steps:
      - name: Queue an independent workflow from the saved private checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run finmind-backer-canary.yml --repo "$GITHUB_REPOSITORY"
          --ref "$GITHUB_REF_NAME" -f "r12_origin=$GITHUB_RUN_ID"
  archive-test-run:
    name: Save Backer test history to private Drive
    if: always() && github.repository == 'danny541690/C1-PAID-DOWNLOADER'
    needs: [release-check, rehearsal-prepare, rehearsal-recover, rehearsal-accept, ledger-origin, ledger-acceptance, live-bronze-capture, live-bronze-accept, batch-dispatch, batch-accept, finish-source, finish-existing, finish-accept, finish-readback, rollout-dispatch, rollout-accept, rollout-resume-trigger]
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive the current attempt and verify the private Drive readback
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python3 -m scripts.r11_backer.test_archive --current-only
