name: R11.1 Backer pre-release pilot
on:
  push:
    branches:
      - codex/r11-1-backer-preflight
    paths:
      - scripts/r11_backer/**
      - tests/test_r11_backer.py
      - .github/workflows/r11-backer-bootstrap.yml
  pull_request:
    paths:
      - scripts/r11_backer/**
      - tests/test_r11_backer.py
      - .github/workflows/r11-backer-bootstrap.yml
permissions:
  contents: read
jobs:
  synthetic-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify historical candidate catalog and release holds
        run: python3 -m scripts.r11_backer.preflight --catalog-only
      - name: Run synthetic archive and preflight tests
        run: python3 -m unittest discover -s tests -p test_r11_backer.py -v
  live-read-only-preflight:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/r11-1-backer-preflight'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    outputs:
      pilot: ${{ steps.probe.outputs.pilot }}
      drive: ${{ steps.probe.outputs.drive }}
      finmind: ${{ steps.probe.outputs.finmind }}
      historical: ${{ steps.probe.outputs.backer_historical_probe }}
      recent: ${{ steps.probe.outputs.backer_recent_probe }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Drive metadata and bounded Backer samples
        id: probe
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          FINMIND_BACKER_TOKEN: ${{ secrets.FINMIND_BACKER_TOKEN }}
        run: python3 -m scripts.r11_backer.live_preflight
  remote-seed:
    if: github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      seed: ${{ steps.create.outputs.seed }}
    steps:
      - id: create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="codex/r11-cas-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          api="repos/$GITHUB_REPOSITORY"
          path=".jarvis-test/r11-synthetic.json"
          gh api "$api/git/refs" -f ref="refs/heads/$branch" -f sha="$GITHUB_SHA" >/dev/null
          payload=$(printf '{"remaining":1,"owner":null}' | base64 -w0)
          seed=$(gh api --method PUT "$api/contents/$path" -f branch="$branch" -f content="$payload" -f message='Seed synthetic quota test' --jq .content.sha)
          test -n "$seed"
          printf 'seed=%s\n' "$seed" >> "$GITHUB_OUTPUT"
  remote-claim:
    needs: remote-seed
    permissions:
      contents: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        worker: [alpha, beta, gamma]
    steps:
      - id: claim
        env:
          GH_TOKEN: ${{ github.token }}
          SEED: ${{ needs.remote-seed.outputs.seed }}
          WORKER: ${{ matrix.worker }}
        run: |
          set -euo pipefail
          branch="codex/r11-cas-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          api="repos/$GITHUB_REPOSITORY/contents/.jarvis-test/r11-synthetic.json"
          payload=$(printf '{"remaining":0,"owner":"%s"}' "$WORKER" | base64 -w0)
          if gh api --method PUT "$api" -f branch="$branch" -f sha="$SEED" -f content="$payload" -f message='Claim synthetic quota' >"$RUNNER_TEMP/claim" 2>"$RUNNER_TEMP/claim-error"; then
            result=GRANTED
          else
            grep -Eq 'HTTP (409|422)' "$RUNNER_TEMP/claim-error"
            result=STALE_REJECTED
          fi
          state=$(gh api "$api?ref=$branch" --jq '.content | @base64d | fromjson')
          jq -e '.remaining == 0 and (.owner == "alpha" or .owner == "beta" or .owner == "gamma")' <<< "$state" >/dev/null
          if [[ "$result" == GRANTED ]]; then
            jq -e --arg worker "$WORKER" '.owner == $worker' <<< "$state" >/dev/null
          else
            jq -e --arg worker "$WORKER" '.owner != $worker' <<< "$state" >/dev/null
          fi
          printf 'synthetic_claim=%s\n' "$result"
          printf 'result=%s\n' "$result" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.claim.outputs.result == 'GRANTED'
      - name: Write isolated archive with the single granted claim
        if: steps.claim.outputs.result == 'GRANTED'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python3 -m scripts.r11_backer.drive_pilot
  drive-round-trip:
    needs: remote-claim
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Recover the staged archive and reject late or duplicate commits
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: bash scripts/r11_backer/recovery_pilot.sh
  pilot-verdict:
    if: always() && github.event_name == 'push'
    needs: [synthetic-checks, live-read-only-preflight, remote-claim, drive-round-trip]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Publish consolidated pilot verdict
        env:
          REGRESSION: ${{ needs.synthetic-checks.result }}
          LIVE_JOB: ${{ needs.live-read-only-preflight.result }}
          DRIVE_ROUND_TRIP: ${{ needs.drive-round-trip.result }}
          REMOTE: ${{ needs.remote-claim.result }}
          LIVE_PILOT: ${{ needs.live-read-only-preflight.outputs.pilot }}
          DRIVE: ${{ needs.live-read-only-preflight.outputs.drive }}
          FINMIND: ${{ needs.live-read-only-preflight.outputs.finmind }}
          HISTORICAL: ${{ needs.live-read-only-preflight.outputs.historical }}
          RECENT: ${{ needs.live-read-only-preflight.outputs.recent }}
        run: |
          verdict=HOLD
          if [[ "$REGRESSION" == success && "$LIVE_JOB" == success && "$LIVE_PILOT" == PASS && "$REMOTE" == success && "$DRIVE_ROUND_TRIP" == success ]]; then
            verdict=PASS
          fi
          {
            printf '## Backer pre-release pilot\n\n'
            printf -- '- Pilot verdict: %s\n' "$verdict"
            printf -- '- Synthetic regression: %s\n' "$REGRESSION"
            printf -- '- Drive metadata and target: %s\n' "${DRIVE:-NO_RESULT}"
            printf -- '- FinMind account quota: %s\n' "${FINMIND:-NO_RESULT}"
            printf -- '- Historical sample: %s\n' "${HISTORICAL:-NO_RESULT}"
            printf -- '- Recent 120-day sample: %s\n' "${RECENT:-NO_RESULT}"
            printf -- '- Cross-runner synthetic quota: %s\n' "$REMOTE"
            printf -- '- Drive synthetic archive and cross-runner recovery: %s\n' "$DRIVE_ROUND_TRIP"
            printf -- '- Production release: HOLD (outside this pilot)\n'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          test "$verdict" = PASS
