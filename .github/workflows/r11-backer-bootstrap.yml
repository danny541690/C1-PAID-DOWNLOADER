name: R11.1 Backer pre-release pilot
on:
  push:
    branches:
      - codex/r11-1-backer-preflight
  pull_request:
    paths:
      - scripts/r11_backer/**
      - tests/test_r11_backer.py
      - .github/workflows/r11-backer-bootstrap.yml
concurrency:
  group: r11-backer-pilot-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  synthetic-checks:
    if: >-
      ${{ !(github.event_name == 'push' && contains(github.event.head_commit.message, '[r12-release-batch]')) &&
          !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.head.ref == 'codex/r11-1-backer-preflight') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify historical candidate catalog and release holds
        run: python3 -m scripts.r11_backer.preflight --catalog-only
      - name: Run synthetic archive and preflight tests
        run: python3 -m unittest discover -s tests -p test_r11_backer.py -v
      - name: Validate incremental probe plan without credentials
        run: python3 -m scripts.r11_backer.dataset_pilot --plan
  public-catalog:
    if: >-
      ${{ !(github.event_name == 'push' && contains(github.event.head_commit.message, '[r12-release-batch]')) &&
          !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.head.ref == 'codex/r11-1-backer-preflight') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile pinned public documentation and historical candidates
        run: python3 -m scripts.r11_backer.reconcile_catalog
      - uses: actions/upload-artifact@v4
        with:
          name: r11-public-catalog-${{ github.run_attempt }}
          path: r11-public-catalog.json
          if-no-files-found: error
          retention-days: 14
  live-read-only-preflight:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/r11-1-backer-preflight' && (contains(github.event.head_commit.message, '[r11-live-pilot]') || contains(github.event.head_commit.message, '[r11-full-preflight]'))
    runs-on: ubuntu-latest
    timeout-minutes: 4
    outputs:
      pilot: ${{ steps.probe.outputs.pilot }}
      drive: ${{ steps.probe.outputs.drive }}
      finmind: ${{ steps.probe.outputs.finmind }}
      historical: ${{ steps.probe.outputs.backer_historical_probe }}
      recent: ${{ steps.probe.outputs.backer_recent_probe }}
    steps:
      - uses: actions/checkout@v4
      - name: Check current Drive and quota and reuse verified macro samples
        id: probe
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          FINMIND_BACKER_TOKEN: ${{ secrets.FINMIND_BACKER_TOKEN }}
          R11_REUSE_MACRO_PILOT: '1'
          R11_FULL_PREFLIGHT: ${{ contains(github.event.head_commit.message, '[r11-full-preflight]') }}
        run: |
          set -euo pipefail
          export R11_PENDING_PROBES="$(python3 -m scripts.r11_backer.dataset_pilot --count)"
          if [[ "$R11_FULL_PREFLIGHT" == true ]]; then
            sweep_plan=$(python3 -c 'from scripts.r11_backer.preflight import read_catalog; from scripts.r11_backer.release_probes import BULK_CANDIDATES; print(sum(r["routing"].startswith("B") for r in read_catalog()) + 10 * len(BULK_CANDIDATES) + 2)')
            export R11_PENDING_PROBES="$((R11_PENDING_PROBES + sweep_plan))"
          fi
          printf 'Backer request ceiling: %s (one account check plus %s pending sample requests)\n'             "$((1 + R11_PENDING_PROBES))" "$R11_PENDING_PROBES" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 -m scripts.r11_backer.live_preflight
  remote-seed:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/r11-1-backer-preflight' && (contains(github.event.head_commit.message, '[r11-live-pilot]') || contains(github.event.head_commit.message, '[r11-full-preflight]'))
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      seed: ${{ steps.create.outputs.seed }}
    steps:
      - id: create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="codex/r11-cas-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          api="repos/$GITHUB_REPOSITORY"
          path=".jarvis-test/r11-synthetic.json"
          gh api "$api/git/refs" -f ref="refs/heads/$branch" -f sha="$GITHUB_SHA" >/dev/null
          payload=$(printf '{"remaining":1,"owner":null,"events":[],"paused_until":0}' | base64 -w0)
          seed=$(gh api --method PUT "$api/contents/$path" -f branch="$branch" -f content="$payload" -f message='Seed synthetic quota test' --jq .content.sha)
          test -n "$seed"
          printf 'seed=%s\n' "$seed" >> "$GITHUB_OUTPUT"
  remote-claim:
    needs: [remote-seed, live-read-only-preflight]
    if: needs.live-read-only-preflight.outputs.pilot == 'PASS'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        worker: [alpha, beta, gamma]
    steps:
      - uses: actions/checkout@v4
      - id: claim
        env:
          GH_TOKEN: ${{ github.token }}
          SEED: ${{ needs.remote-seed.outputs.seed }}
          WORKER: ${{ matrix.worker }}
        run: |
          set -euo pipefail
          branch="codex/r11-cas-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          api="repos/$GITHUB_REPOSITORY/contents/.jarvis-test/r11-synthetic.json"
          count=$(python3 -m scripts.r11_backer.dataset_pilot --count)
          now=$(date +%s)
          snapshot=$(gh api "$api?ref=$branch" --jq '.content | @base64d')
          if (( count > 0 )) && jq -e '.remaining == 1' <<< "$snapshot" >/dev/null; then
            python3 - "$now" "$snapshot" "$count" <<'PYCODE'
          import json
          import sys
          from scripts.r11_backer.quota import can_reserve

          state = json.loads(sys.argv[2])
          if not can_reserve(state["events"], int(sys.argv[1]), "probe",
                             total_limit=int(sys.argv[3]), paused_until=state["paused_until"]):
              raise SystemExit("pilot rolling quota unavailable")
          PYCODE
          fi
          payload=$(jq -nc --arg worker "$WORKER" --argjson now "$now" --argjson count "$count"             '{remaining:0,owner:$worker,events:[range($count) | [$now,"probe"]],paused_until:0}' | base64 -w0)
          if gh api --method PUT "$api" -f branch="$branch" -f sha="$SEED" -f content="$payload" -f message='Claim synthetic quota' >"$RUNNER_TEMP/claim" 2>"$RUNNER_TEMP/claim-error"; then
            result=GRANTED
          else
            grep -Eq 'HTTP (409|422)' "$RUNNER_TEMP/claim-error"
            result=STALE_REJECTED
          fi
          state=$(gh api "$api?ref=$branch" --jq '.content | @base64d | fromjson')
          jq -e --argjson count "$count" '.remaining == 0 and (.events | length == $count) and all(.events[]; .[1] == "probe") and (.owner == "alpha" or .owner == "beta" or .owner == "gamma")' <<< "$state" >/dev/null
          if [[ "$result" == GRANTED ]]; then
            jq -e --arg worker "$WORKER" '.owner == $worker' <<< "$state" >/dev/null
          else
            jq -e --arg worker "$WORKER" '.owner != $worker' <<< "$state" >/dev/null
          fi
          printf 'synthetic_claim=%s\n' "$result"
          printf 'result=%s\n' "$result" >> "$GITHUB_OUTPUT"
      - name: Probe uncovered windows under one reserved Backer batch
        if: steps.claim.outputs.result == 'GRANTED'
        env:
          FINMIND_BACKER_TOKEN: ${{ secrets.FINMIND_BACKER_TOKEN }}
        run: python3 -m scripts.r11_backer.dataset_pilot
      - name: Write isolated archive with the single granted claim
        if: steps.claim.outputs.result == 'GRANTED'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python3 -m scripts.r11_backer.drive_pilot
  drive-round-trip:
    needs: remote-claim
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Recover the staged archive and reject late or duplicate commits
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: bash scripts/r11_backer/recovery_pilot.sh
  release-sweep:
    needs: live-read-only-preflight
    if: needs.live-read-only-preflight.outputs.pilot == 'PASS' && contains(github.event.head_commit.message, '[r11-full-preflight]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      archive: ${{ steps.result.outputs.archive }}
      completed: ${{ steps.result.outputs.completed }}
    steps:
      - uses: actions/checkout@v4
      - name: Sweep Backer contracts and benchmark five closed sessions
        env:
          FINMIND_BACKER_TOKEN: ${{ secrets.FINMIND_BACKER_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python3 -m scripts.r11_backer.release_probes
      - name: Read back the sanitized release sweep outputs
        id: result
        run: |
          printf 'archive=%s\n' "$(jq -er .archive r11-release-probes.json)" >> "$GITHUB_OUTPUT"
          printf 'completed=%s\n' "$(jq -r .dataset_sweep_complete r11-release-probes.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: r11-release-probes-${{ github.run_attempt }}
          path: r11-release-probes.json
          if-no-files-found: error
          retention-days: 30
  gap-diagnostics:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/r11-1-backer-preflight' && contains(github.event.head_commit.message, '[r11-gap-preflight]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Recheck changed query windows and measure larger all-market responses
        env:
          FINMIND_BACKER_TOKEN: ${{ secrets.FINMIND_BACKER_TOKEN }}
        run: python3 -m scripts.r11_backer.release_gaps
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r11-release-gaps-${{ github.run_attempt }}
          path: r11-release-gaps.json
          if-no-files-found: error
          retention-days: 30
  market-scope:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/r11-1-backer-preflight' && contains(github.event.head_commit.message, '[r11-market-test]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compare bulk data with the Taiwan listing and OTC master
        env:
          FINMIND_BACKER_TOKEN: ${{ secrets.FINMIND_BACKER_TOKEN }}
        run: python3 -m scripts.r11_backer.market_scope
      - uses: actions/upload-artifact@v4
        with:
          name: r11-market-scope-${{ github.run_attempt }}
          path: r11-market-scope.json
          if-no-files-found: error
          retention-days: 30
  contract-closeout:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/r11-1-backer-preflight' && (contains(github.event.head_commit.message, '[r11-contract-closeout]') || contains(github.event.head_commit.message, '[r11-identity-followup]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify remaining data contracts and historical listing evidence
        env:
          FINMIND_BACKER_TOKEN: ${{ secrets.FINMIND_BACKER_TOKEN }}
          IDENTITY_ONLY: ${{ contains(github.event.head_commit.message, '[r11-identity-followup]') }}
        run: |
          if [[ "$IDENTITY_ONLY" == true ]]; then
            python3 -m scripts.r11_backer.contract_closeout --identity-only
          else
            python3 -m scripts.r11_backer.contract_closeout
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r11-contract-closeout-${{ github.run_attempt }}
          path: r11-contract-closeout.json
          if-no-files-found: error
          retention-days: 30
  release-remediation:
    name: Verify targeted Backer release improvements
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/r11-1-backer-preflight' && (contains(github.event.head_commit.message, '[r11-release-remediation]') || contains(github.event.head_commit.message, '[r11-remediation-followup]'))
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reconcile native fields, dated official closes, bounded archives, and Drive capacity
        env:
          FINMIND_BACKER_TOKEN: ${{ secrets.FINMIND_BACKER_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          R11_REMEDIATION_FOLLOWUP: ${{ contains(github.event.head_commit.message, '[r11-remediation-followup]') }}
        run: python3 -m scripts.r11_backer.release_remediation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r11-release-remediation-${{ github.run_attempt }}
          path: r11-release-remediation.json
          if-no-files-found: error
          retention-days: 30
  history-capacity:
    name: Validate historical windows, publication dates and capacity
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/r11-1-backer-preflight' && contains(github.event.head_commit.message, '[r11-history-capacity]')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      archive: ${{ steps.history.outputs.archive }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check real Backer periods and stage one private monthly archive
        id: history
        env:
          FINMIND_BACKER_TOKEN: ${{ secrets.FINMIND_BACKER_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python3 -m scripts.r11_backer.history_pilot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r11-history-capacity-${{ github.run_attempt }}
          path: r11-history-capacity.json
          if-no-files-found: error
          retention-days: 30
  history-readback:
    name: Independently verify the historical archive and month index
    needs: [history-capacity, synthetic-checks]
    if: needs.history-capacity.outputs.archive == 'STAGED'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Rebuild the month index and compare both digests
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python3 -m scripts.r11_backer.history_pilot --verify-only
  history-followup:
    name: Reconcile the early TWSE calendar and monthly revenue
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/r11-1-backer-preflight' && (contains(github.event.head_commit.message, '[r11-history-followup]') || contains(github.event.head_commit.message, '[r11-calendar-retry]'))
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: contains(github.event.head_commit.message, '[r11-calendar-retry]')
        with:
          name: r11-history-followup-1
          path: r11-prior-calendar
          run-id: 45651767533
          github-token: ${{ github.token }}
      - name: Compare official historical sessions and fix period-based revenue retrieval
        if: contains(github.event.head_commit.message, '[r11-history-followup]')
        env:
          FINMIND_BACKER_TOKEN: ${{ secrets.FINMIND_BACKER_TOKEN }}
        run: python3 -m scripts.r11_backer.history_pilot --followup
      - name: Reuse the verified index and retry only missing TWSE months
        if: contains(github.event.head_commit.message, '[r11-calendar-retry]')
        env:
          FINMIND_BACKER_TOKEN: ${{ secrets.FINMIND_BACKER_TOKEN }}
        run: python3 -m scripts.r11_backer.history_pilot --retry-calendar r11-prior-calendar/r11-twse-early-session-index.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r11-history-followup-${{ github.run_attempt }}
          path: |
            r11-history-capacity.json
            r11-twse-early-session-index.json
          if-no-files-found: error
          retention-days: 30
  tpex-market-history:
    name: Reconcile TPEx sessions and effective market identity
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/r11-1-backer-preflight' && (contains(github.event.head_commit.message, '[r11-tpex-history]') || contains(github.event.head_commit.message, '[r11-tpex-calendar-check]'))
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      archive: ${{ steps.reconcile.outputs.archive }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the official yearbook reader
        if: contains(github.event.head_commit.message, '[r11-tpex-history]')
        run: |
          python3 -m venv "$RUNNER_TEMP/r11-tpex"
          "$RUNNER_TEMP/r11-tpex/bin/python" -m pip install --disable-pip-version-check --no-deps xlrd==2.0.1
      - name: Compare official daily evidence with Backer and stage original sources privately
        id: reconcile
        env:
          FINMIND_BACKER_TOKEN: ${{ secrets.FINMIND_BACKER_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          R11_TPEX_CALENDAR_ONLY: ${{ contains(github.event.head_commit.message, '[r11-tpex-calendar-check]') }}
        run: |
          if [[ "$R11_TPEX_CALENDAR_ONLY" == true ]]; then
            python3 -m scripts.r11_backer.tpex_history --reconcile-calendar
          else
            "$RUNNER_TEMP/r11-tpex/bin/python" -m scripts.r11_backer.tpex_history
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r11-tpex-history-${{ github.run_attempt }}
          path: r11-tpex-history.json
          if-no-files-found: error
          retention-days: 30
  tpex-market-readback:
    name: Independently verify private TPEx source evidence
    needs: [tpex-market-history, synthetic-checks]
    if: needs.tpex-market-history.outputs.archive == 'STAGED'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compare official and Backer archive files against their recorded digests
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python3 -m scripts.r11_backer.tpex_history --verify-only
  market-lifetime-ledger:
    name: Reconcile official listing periods and source-specific fallback
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/r11-1-backer-preflight' && contains(github.event.head_commit.message, '[r11-lifetime-ledger]')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      archive: ${{ steps.reconcile.outputs.archive }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check official listing boundaries and stage evidence in private Drive
        id: reconcile
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python3 -m scripts.r11_backer.market_lifetimes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r11-market-lifetimes-${{ github.run_attempt }}
          path: r11-market-lifetimes.json
          if-no-files-found: error
          retention-days: 30
  market-lifetime-readback:
    name: Verify private listing periods and fallback from Drive
    needs: [market-lifetime-ledger, synthetic-checks]
    if: needs.market-lifetime-ledger.outputs.archive == 'STAGED'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify original evidence digests and reproduce official fallback
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python3 -m scripts.r11_backer.market_lifetimes --verify-only
  tpex-official-calendar:
    name: Verify TPEx early trading dates and yearbook discrepancy
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/r11-1-backer-preflight' && (contains(github.event.head_commit.message, '[r11-tpex-official-calendar]') || contains(github.event.head_commit.message, '[r11-tpex-calendar-repair]'))
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      archive: ${{ steps.reconcile.outputs.archive }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the official yearbook reader
        run: |
          python3 -m venv "$RUNNER_TEMP/r11-tpex"
          "$RUNNER_TEMP/r11-tpex/bin/python" -m pip install --disable-pip-version-check --no-deps xlrd==2.0.1
      - name: Compare original market and price records and archive the result privately
        id: reconcile
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          R11_RESUME_CALENDAR: ${{ contains(github.event.head_commit.message, '[r11-tpex-calendar-repair]') && '45664576931' || '' }}
        run: |
          args=()
          if [[ -n "$R11_RESUME_CALENDAR" ]]; then
            args+=(--resume-from "$R11_RESUME_CALENDAR")
          fi
          "$RUNNER_TEMP/r11-tpex/bin/python" -m scripts.r11_backer.tpex_calendar "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r11-tpex-official-calendar-${{ github.run_attempt }}
          path: r11-tpex-history.json
          if-no-files-found: error
          retention-days: 30
  tpex-official-calendar-readback:
    name: Reproduce the TPEx calendar from private Drive sources
