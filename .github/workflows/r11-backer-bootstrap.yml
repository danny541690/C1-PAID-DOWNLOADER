  final-preflight:
    name: Reconcile all pre-release checks and replay a real archive
    if: github.event_name == 'push' && github.repository == 'danny541690/C1-PAID-DOWNLOADER' && github.ref == 'refs/heads/codex/r11-1-backer-preflight' && contains(github.event.head_commit.message, '[r11-final-preflight]')
    needs: [integration-b10, final-source-probes]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: r11-integration-verdict-${{ github.run_attempt }}
      - name: Test real Drive collisions and archived source and gate coverage
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python3 -m scripts.r11_backer.final_preflight
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r11-final-preflight-${{ github.run_attempt }}
          path: r11-final-preflight.json
          if-no-files-found: error
          retention-days: 30
  paid-archive-readback:
    needs: release-sweep
    if: needs.release-sweep.outputs.archive == 'STAGED_PRIVATE_SAMPLES'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify paid originals in private Drive on a separate runner
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python3 -m scripts.r11_backer.release_probes --verify-only
  pilot-verdict:
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/codex/r11-1-backer-preflight' && (contains(github.event.head_commit.message, '[r11-live-pilot]') || contains(github.event.head_commit.message, '[r11-full-preflight]'))
    needs: [synthetic-checks, public-catalog, live-read-only-preflight, remote-claim, drive-round-trip, release-sweep, paid-archive-readback]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        if: contains(github.event.head_commit.message, '[r11-full-preflight]')
      - uses: actions/download-artifact@v4
        if: contains(github.event.head_commit.message, '[r11-full-preflight]') && needs.release-sweep.result == 'success'
        with:
          name: r11-release-probes-${{ github.run_attempt }}
      - name: Reconcile the complete release test register
        if: contains(github.event.head_commit.message, '[r11-full-preflight]')
        env:
          DRIVE_ROUND_TRIP: ${{ needs.drive-round-trip.result }}
          PRIVATE_READBACK: ${{ needs.paid-archive-readback.result }}
        run: python3 -m scripts.r11_backer.acceptance_report
      - uses: actions/upload-artifact@v4
        if: contains(github.event.head_commit.message, '[r11-full-preflight]')
        with:
          name: r11-release-acceptance-${{ github.run_attempt }}
          path: r11-release-acceptance.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish consolidated pilot verdict
        env:
          FULL_RUN: ${{ contains(github.event.head_commit.message, '[r11-full-preflight]') }}
          SWEEP_COMPLETE: ${{ needs.release-sweep.outputs.completed }}
          PRIVATE: ${{ needs.paid-archive-readback.result }}
          CATALOG: ${{ needs.public-catalog.result }}
          REGRESSION: ${{ needs.synthetic-checks.result }}
          LIVE_JOB: ${{ needs.live-read-only-preflight.result }}
          DRIVE_ROUND_TRIP: ${{ needs.drive-round-trip.result }}
          REMOTE: ${{ needs.remote-claim.result }}
          LIVE_PILOT: ${{ needs.live-read-only-preflight.outputs.pilot }}
          DRIVE: ${{ needs.live-read-only-preflight.outputs.drive }}
          FINMIND: ${{ needs.live-read-only-preflight.outputs.finmind }}
          HISTORICAL: ${{ needs.live-read-only-preflight.outputs.historical }}
          RECENT: ${{ needs.live-read-only-preflight.outputs.recent }}
        run: |
          verdict=HOLD
          if [[ "$REGRESSION" == success && "$CATALOG" == success && "$LIVE_JOB" == success && "$LIVE_PILOT" == PASS && "$REMOTE" == success && "$DRIVE_ROUND_TRIP" == success ]]; then
            verdict=PASS
          fi
          if [[ "$FULL_RUN" == true && ( "$SWEEP_COMPLETE" != true || "$PRIVATE" != success ) ]]; then
            verdict=HOLD
          fi
          {
            printf '## Backer pre-release pilot\n\n'
            printf -- '- Pilot verdict: %s\n' "$verdict"
            printf -- '- Public catalog reconciliation: %s\n' "$CATALOG"
            printf -- '- Synthetic regression: %s\n' "$REGRESSION"
            printf -- '- Drive metadata and target: %s\n' "${DRIVE:-NO_RESULT}"
            printf -- '- FinMind account quota: %s\n' "${FINMIND:-NO_RESULT}"
            printf -- '- Prior historical sample (reused): %s\n' "${HISTORICAL:-NO_RESULT}"
            printf -- '- Prior 120-day sample (reused): %s\n' "${RECENT:-NO_RESULT}"
            printf -- '- Cross-runner quota reservation and bounded Backer request: %s\n' "$REMOTE"
            printf -- '- Drive synthetic archive and cross-runner recovery: %s\n' "$DRIVE_ROUND_TRIP"
            printf -- '- Production release: HOLD (outside this pilot)\n'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          test "$verdict" = PASS
  backfill-test-history:
