name: R12.1 V2.4 Official Bulk and Bronze Readiness
on:
  push:
    branches: [codex/r12-final-readiness-v2]
    paths:
      - .github/workflows/r12-v24-official-bulk.yml
      - scripts/r11_backer/official_bulk_v24.py
permissions:
  contents: read
  actions: read
concurrency:
  group: r12-1-bounded-preflight
  cancel-in-progress: false
env:
  R12_TASK_ID: R12-FINAL-READINESS-V2-01
  R12_SPEC_SHA: 197052e312c1cb41767d94c657eac4ca1196448b5b9610fdab099f4a22c6fd94
  R12_V24_RESUME_FROM: '46087432902_1_8918c307960e70e61383c9d9313af6367e9e1089'
jobs:
  LOCK:
    if: ${{ github.repository == 'danny541690/C1-PAID-DOWNLOADER' && contains(github.event.head_commit.message, '[r12-v24-preflight]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record LOCK in private Drive
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python3 -m scripts.r11_backer.official_bulk_v24 LOCK
  H:
    needs: [LOCK]
    if: ${{ always() && !cancelled() && github.repository == 'danny541690/C1-PAID-DOWNLOADER' && contains(github.event.head_commit.message, '[r12-v24-preflight]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record H in private Drive
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python3 -m scripts.r11_backer.official_bulk_v24 H
  G05_A:
    needs: [LOCK]
    if: ${{ always() && !cancelled() && github.repository == 'danny541690/C1-PAID-DOWNLOADER' && contains(github.event.head_commit.message, '[r12-v24-preflight]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Record G05_A in private Drive
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          FINMIND_BACKER_TOKEN: ${{ secrets.FINMIND_BACKER_TOKEN }}
        run: python3 -m scripts.r11_backer.official_bulk_v24 G05_A
  G03_OFFICIAL:
    needs: [LOCK]
    if: ${{ always() && !cancelled() && github.repository == 'danny541690/C1-PAID-DOWNLOADER' && contains(github.event.head_commit.message, '[r12-v24-preflight]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
